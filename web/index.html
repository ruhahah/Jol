<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Jol — карта доступности Шымкента: пандусы, ступеньки и двери, проверенные людьми у входа." />
    <meta name="theme-color" content="#F5F1E8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1218" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Jol — карта доступности Шымкента</title>
    <script>
      // До первой отрисовки, чтобы тема не мигала
      try {
        var p = JSON.parse(localStorage.getItem('jol:prefs') || '{}')
        if (p.theme) document.documentElement.dataset.theme = p.theme
        if (p.largeText) document.documentElement.dataset.text = 'large'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
