# Проверки при каждой отправке кода на GitHub: диалоги бота, SQL и сборка сайта.
# Результат — во вкладке Actions репозитория. Секреты не нужны: база и Telegram подменяются.
name: tests

on:
  push:
  pull_request:

jobs:
  bot-and-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r bot/requirements.txt pgserver asyncpg
      - name: Диалоги бота
        run: python tests/test_bot_flow.py
      - name: SQL на встроенном Postgres
        run: python tests/test_sql.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Проверка типов и сборка
        run: npm run build
